:root[data-theme="dark"]{
  --g1:#2f7fd6; --g2:#0a2e6b;
  --brand:#5fa8ff; --brand-2:#8cc2ff; --brand-dark:#8cc2ff;
  --brand-ink:#8cc2ff;
  --brand-tint:#16273f; --brand-tint-2:#13223a; --brand-tint-strong:#1e3555; --brand-tint-border:#2a4770;
  --bg:#0d1520; --card:#152131; --ink:#e9f0f8; --muted:#93a6bd; --line:#26374d;
  --soft:#1a2739; --chip-bg:#1a2739;
  --ok:#34d399; --ok-bg:#123529; --ok-ink:#6ee7b7;
  --warn:#fbbf24; --warn-bg:#3a2c10; --warn-ink:#fcd34d;
  --danger:#f87171; --danger-bg:#3d1618; --danger-ink:#fca5a5;
  --gray:#93a6bd; --gray-bg:#1a2739;
  --backdrop:rgba(0,0,0,.6);
  --glow:rgba(0,0,0,.45);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.42);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.34);
  --shadow-lg:0 8px 20px rgba(0,0,0,.5),0 22px 48px rgba(0,0,0,.55);
  --card-bd:rgba(255,255,255,.06);
  --nav-glass:rgba(21,33,49,.78);
  --ring:rgba(95,168,255,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Kanit','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
/* overflow-x:clip กันเลื่อนแนวนอน แต่ไม่ทำลาย position:sticky ของหัวแอป */
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:clip;transition:background .25s ease;
  background:radial-gradient(130% 55% at 50% -12%, var(--brand-tint-2) 0%, transparent 62%), var(--bg)}
.hidden{display:none!important}

/* ===== โลโก้ (พื้นหลังจาก CSS var ทำงานได้ทั้ง preview และ PWA) ===== */
.brand-logo{width:78px;height:78px;border-radius:24px;margin:0 auto 18px;
  background:#fff var(--logo) center/cover no-repeat;box-shadow:var(--shadow-lg);border:1px solid var(--card-bd)}

.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;
  background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 100%)}
.login-card{background:var(--card);border-radius:28px;padding:34px 24px;box-shadow:var(--shadow-lg);border:1px solid var(--card-bd)}
.login-title{text-align:center;font-size:22px;font-weight:700;margin:0 0 4px}
.login-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--soft);transition:border .15s,background .15s,box-shadow .15s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 4px var(--ring)}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;
  transition:transform .08s ease,box-shadow .18s ease,opacity .15s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 6px 18px var(--glow)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:var(--gray-bg);color:var(--ink)}
.btn-danger{background:var(--danger-bg);color:var(--danger-ink)}
.btn-ok{background:var(--ok);color:#fff}
@media(hover:hover){.btn-primary:hover{filter:brightness(1.05);box-shadow:0 10px 26px var(--glow)}
  .btn-ok:hover{filter:brightness(1.05)} .btn-ghost:hover,.btn-danger:hover{filter:brightness(.97)}}
.err{color:var(--danger-ink);font-size:13px;margin-top:8px;min-height:18px;text-align:center}

/* ===== หัวแอป (personalized greeting + โลโก้ + ปุ่มโหมดกลางคืน + avatar) ===== */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;
  padding:16px 16px 20px;border-radius:0 0 26px 26px;box-shadow:0 10px 26px var(--glow)}
.topbar::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 90% at 88% -25%, rgba(255,255,255,.28), transparent 58%)}
.topbar>*{position:relative;z-index:1}
.topbar-row{display:flex;align-items:center;gap:11px}
.tb-logo{width:44px;height:44px;border-radius:13px;flex-shrink:0;
  background:#fff var(--logo) center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tb-info{flex:1;min-width:0}
.topbar .greet{font-size:12.5px;font-weight:400;opacity:.92;margin:0;line-height:1.2}
.topbar .tb-name{font-size:19px;font-weight:700;margin:1px 0 0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tb-sub{font-size:11.5px;opacity:.85;margin:1px 0 0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.theme-toggle{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.theme-toggle:active{background:rgba(255,255,255,.36)}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;flex-shrink:0;overflow:hidden;cursor:default;box-shadow:0 0 0 2px rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.18)}
.content{padding:16px 16px 96px;min-height:calc(100vh - 200px)}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section-title{font-size:15.5px;font-weight:700;margin:8px 2px 11px;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--card-bd)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border:1px solid var(--card-bd)}
.stat .num{font-size:26px;font-weight:700;line-height:1}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.pending .num{color:var(--warn)}
.stat.approved .num{color:var(--ok)}

.action-btn{display:flex;align-items:center;gap:14px;width:100%;background:linear-gradient(135deg,var(--g1),var(--g2));
  color:#fff;border:none;border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:0 8px 20px var(--glow);margin-bottom:16px}
.action-btn .ic{font-size:22px;background:rgba(255,255,255,.2);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.action-btn .t1{font-weight:700;font-size:16px;text-align:left}
.action-btn .t2{font-size:12.5px;opacity:.9;text-align:left}
.approve-alert{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border-radius:var(--radius);padding:16px;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;cursor:pointer;box-shadow:0 8px 20px rgba(245,158,11,.3)}
.approve-alert .badge-count{background:#fff;color:#f97316;font-weight:700;border-radius:999px;padding:2px 11px;font-size:14px}

.leave-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.leave-item:last-child{border-bottom:none}
.leave-item .lt-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.leave-item .li-body{flex:1;min-width:0}
.leave-item .li-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.leave-item .li-type{font-weight:600;font-size:15px}
.leave-item .li-dates{color:var(--muted);font-size:13px;margin-top:2px}
.leave-item .li-reason{color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.pending{background:var(--warn-bg);color:var(--warn-ink)}
.badge.approved{background:var(--ok-bg);color:var(--ok-ink)}
.badge.rejected{background:var(--danger-bg);color:var(--danger-ink)}
.badge.cancelled{background:var(--gray-bg);color:var(--gray)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .ic{font-size:40px;opacity:.4}
.empty p{margin:10px 0 0;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1.5px solid var(--line);background:var(--chip-bg);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:all .12s;color:var(--ink)}
.chip .cdot{width:9px;height:9px;border-radius:50%}
.chip.active{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink);font-weight:600;box-shadow:0 2px 8px var(--ring)}
.seg{display:flex;gap:8px;margin-top:4px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--chip-bg);border-radius:14px;padding:11px 6px;font-size:14px;cursor:pointer;color:var(--ink);transition:all .15s ease}
.seg button.active{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink);font-weight:600;box-shadow:0 2px 8px var(--ring)}
.days-pill{display:inline-block;background:var(--brand-tint);color:var(--brand-ink);font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px;margin-top:4px}

.sheet-backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:8px 20px 26px;max-height:88vh;overflow-y:auto;
  animation:slideup .28s cubic-bezier(.22,1,.36,1);box-shadow:0 -14px 44px rgba(0,0,0,.2);border-top:1px solid var(--card-bd)}
@keyframes slideup{from{transform:translateY(48px);opacity:.6}to{transform:none;opacity:1}}
.detail-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.detail-row .k{color:var(--muted)}
.detail-row .v{font-weight:600;text-align:right}
.sheet-grip{width:44px;height:5px;border-radius:999px;background:var(--line);margin:8px auto 14px}
.detail-actions{display:flex;gap:10px;margin-top:18px}
.detail-actions .btn{flex:1}

.profile-head{text-align:center;padding:10px 0 4px}
.profile-avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(145deg,var(--g1),var(--g2));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  border:3px solid var(--card);outline:2px solid var(--brand-tint-strong)}
.profile-name{font-size:20px;font-weight:700}
.profile-pos{color:var(--muted);font-size:14px}
.role-tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--brand-tint);color:var(--brand-ink)}

.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--nav-glass);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--card-bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:30;
  box-shadow:0 -6px 24px rgba(13,71,161,.09)}
.nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer;color:var(--muted);position:relative;transition:color .15s ease}
.nav-item .ni-ic{font-size:20px;line-height:1;padding:5px 16px;border-radius:999px;transition:background .22s ease,transform .22s ease}
.nav-item .ni-lbl{font-size:11px;font-weight:500;transition:font-weight .15s ease}
.nav-item.active{color:var(--brand)}
.nav-item.active .ni-ic{background:var(--brand-tint);transform:translateY(-1px)}
.nav-item.active .ni-lbl{font-weight:700}
.nav-item .nav-badge{position:absolute;top:-1px;right:calc(50% - 22px);background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 6px rgba(0,0,0,.2)}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#0f1c2e;color:#fff;padding:12px 20px;border-radius:999px;
  font-size:14px;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .2s;max-width:90%;text-align:center}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;
  animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- feature hub (หน้าแรก) ---- */
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 14px;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;position:relative;text-align:left;transition:transform .12s ease,box-shadow .2s ease;color:var(--ink)}
.tile:active{transform:scale(.97)}
@media(hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}}
.tile .tile-ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;
  box-shadow:0 6px 14px rgba(0,0,0,.16);position:relative;overflow:hidden}
.tile .tile-ic::after{content:'';position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.38),transparent 55%);pointer-events:none}
.tile .tile-lbl{font-weight:700;font-size:15px}
.tile .tile-sub{font-size:12px;color:var(--muted);margin-top:-4px}
.tile .tile-badge{position:absolute;top:12px;right:12px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tile.soon{opacity:.55}
.tile.soon .tile-lbl:after{content:' · เร็วๆ นี้';font-size:10px;color:var(--muted);font-weight:500}

/* ---- calendar ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head button{background:var(--gray-bg);border:none;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;color:var(--ink)}
.cal-head .cal-title{font-weight:700;font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.cal-cell{aspect-ratio:1;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;padding:5px 2px 3px;cursor:pointer;border:1.5px solid transparent;transition:transform .1s ease,background .15s ease}
.cal-cell.other{opacity:.35}
.cal-cell.today{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.cal-cell.has{background:var(--brand-tint-2)}
.cal-cell:active{transform:scale(.93)}
.cal-cell .cal-num{font-size:12.5px;font-weight:600}
.cal-cell .cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px}
.cal-cell .cal-dot{width:6px;height:6px;border-radius:50%}
.cal-cell .cal-more{font-size:9px;color:var(--muted);line-height:1}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:12px;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend .lg-dot{width:9px;height:9px;border-radius:50%}
.day-person{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.day-person:last-child{border-bottom:none}
.day-person .dp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.day-person .dp-name{font-weight:600;font-size:14.5px}
.day-person .dp-type{font-size:12.5px;color:var(--muted)}

/* ---- staff management ---- */
.staff-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.staff-item:last-child{border-bottom:none}
.staff-item .st-av{width:40px;height:40px;border-radius:50%;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--brand-ink);flex-shrink:0}
.staff-item .st-body{flex:1;min-width:0}
.staff-item .st-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.staff-item .st-meta{font-size:12.5px;color:var(--muted)}
.staff-item .st-edit{background:var(--gray-bg);border:none;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--brand-ink);font-weight:600}
.pos-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.pos-ADMIN{background:var(--warn-bg);color:var(--warn-ink)}
.pos-CHIEF{background:#e0e7ff;color:#4338ca}
.pos-STAFF{background:var(--gray-bg);color:var(--muted)}
.fab{position:fixed;bottom:82px;right:calc(50% - 240px + 16px);width:58px;height:58px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:28px;box-shadow:0 10px 24px var(--glow);cursor:pointer;z-index:25;
  transition:transform .12s ease,box-shadow .2s ease}
.fab:active{transform:scale(.92)}
@media(hover:hover){.fab:hover{transform:translateY(-2px);box-shadow:0 14px 32px var(--glow)}}
@media(max-width:496px){.fab{right:16px}}

/* ---- Assignment ---- */
.asg-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.asg-item:last-child{border-bottom:none}
.asg-item .ai-body{flex:1;min-width:0}
.asg-item .ai-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asg-item .ai-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge.published{background:var(--ok-bg);color:var(--ok-ink)}
.badge.draft{background:var(--gray-bg);color:var(--gray)}
.asg-toolbar{display:flex;gap:8px;margin:12px 0}
.asg-toolbar button{flex:1;border:1.5px dashed var(--brand-tint-border);background:var(--soft);border-radius:10px;padding:10px;font-size:13px;cursor:pointer;color:var(--brand-ink);font-weight:600}
.grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
.asg-table{border-collapse:collapse;min-width:100%}
.asg-table td{border:1px solid var(--line);padding:8px 9px;font-size:13px;vertical-align:middle;text-align:center;min-width:90px;max-width:170px;white-space:pre-line;word-break:break-word}
.asg-table td.hd{background:var(--brand-tint);font-weight:700;color:var(--brand-ink);text-align:center}
.asg-cell{cursor:pointer}
.asg-cell.blank{color:var(--brand-tint-border)}
.asg-table td.corner,.asg-table td.rowx{background:var(--soft);min-width:34px;width:34px;text-align:center;padding:2px}
.asg-x{background:none;border:none;color:var(--danger);font-size:15px;cursor:pointer;padding:4px 6px;line-height:1}
.asg-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.asg-actions .btn{flex:1;min-width:120px}
.asg-hint{font-size:12px;color:var(--muted);margin:2px 0 8px}
.readonly-note{font-size:12.5px;color:var(--muted);background:var(--brand-tint-2);border:1px dashed var(--brand-tint-border);border-radius:10px;padding:8px 12px;margin-bottom:12px}
/* แถบสถานที่ปฏิบัติงานของฉัน (จุดสนใจ กึ่งกลาง) */
.duty-band{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:var(--radius);
  padding:18px 18px 16px;margin:2px 0 16px;text-align:center;box-shadow:0 10px 26px var(--glow)}
.duty-band .duty-title{font-weight:700;font-size:15.5px;margin-bottom:12px;letter-spacing:.2px}
.duty-band .duty-spots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.duty-band .duty-spot{background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.28);border-radius:15px;
  padding:11px 18px;min-width:130px}
.duty-band .duty-spot .duty-b{font-weight:700;font-size:16px;line-height:1.2}
.duty-band .duty-spot .duty-m{font-size:12.5px;opacity:.95;margin-top:3px}
.duty-band.duty-none{background:var(--card);color:var(--muted);box-shadow:var(--shadow);border:1px dashed var(--line)}
.duty-band.duty-none .duty-title{color:var(--brand-ink);margin-bottom:6px}
.name-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:150px;overflow-y:auto}
.name-chip{border:1.5px solid var(--line);background:var(--chip-bg);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.name-chip:active{background:var(--brand-tint)}
/* ตรึงหัวตาราง (freeze panes): แถวบน + 2 คอลัมน์แรก */
.grid-scroll.freeze{overflow:auto;max-height:62vh}
.asg-table.freeze-table{border-collapse:separate;border-spacing:0}
.freeze-table td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
.freeze-table tr:first-child td{position:sticky;top:0;z-index:2;background:var(--brand-tint);font-weight:700;color:var(--brand-ink);text-align:center}
.freeze-table td:nth-child(1){position:sticky;left:0;z-index:1;min-width:98px;max-width:98px;font-weight:700;background:var(--soft)}
.freeze-table td:nth-child(2){position:sticky;left:98px;z-index:1;min-width:96px;max-width:96px;font-weight:700;background:var(--soft)}
.freeze-table tr:first-child td:nth-child(1),.freeze-table tr:first-child td:nth-child(2){z-index:3;background:var(--brand-tint-strong)}
.note-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f97316;vertical-align:middle;margin-left:2px}
td.has-note{cursor:pointer}

/* ---- ตัวเลือกรูปโปรไฟล์ (avatar picker) ---- */
.avat-preview{display:flex;justify-content:center;margin:4px 0 14px}
.avat-prev{width:104px;height:104px;border-radius:50%;overflow:hidden;background:var(--soft);
  box-shadow:var(--shadow);border:3px solid var(--card);outline:2px solid var(--brand-tint-strong)}
.avat-prev svg,.avat-prev img{width:100%;height:100%;display:block;object-fit:cover}
.avat-tabs{margin-bottom:4px}
.avat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:236px;overflow-y:auto;padding:3px}
.avat-cell{padding:0;border:2.5px solid transparent;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--soft);aspect-ratio:1}
.avat-cell svg{width:100%;height:100%;display:block}
.avat-cell.sel{border-color:var(--brand)}
.avat-row{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.avat-row-lbl{font-size:13px;font-weight:600;color:var(--muted);width:86px;flex-shrink:0}
.avat-sws{display:flex;gap:9px;flex-wrap:wrap}
.avat-sw{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;transition:transform .1s ease,box-shadow .15s ease}
.avat-sw:active{transform:scale(.9)}
.avat-sw.sel{box-shadow:0 0 0 2.5px var(--brand)}

/* ===== micro-interactions & polish ===== */
.action-btn,.approve-alert{transition:transform .12s ease,box-shadow .2s ease,filter .15s ease}
.action-btn:active,.approve-alert:active{transform:scale(.985)}
.leave-item:active,.asg-item:active,.staff-item:active{opacity:.62}
.theme-toggle:hover{background:rgba(255,255,255,.32)}
.days-pill,.role-tag{box-shadow:0 1px 5px var(--ring)}
.cal-head button{transition:filter .15s ease}
.st-edit{transition:filter .15s ease}
@media(hover:hover){
  .action-btn:hover,.approve-alert:hover{filter:brightness(1.04);box-shadow:var(--shadow-lg)}
  .cal-head button:hover,.st-edit:hover,.asg-toolbar button:hover{filter:brightness(.97)}
  .leave-item:hover,.asg-item:hover,.staff-item:hover{background:var(--soft)}
}

/* ===== ไอคอนเส้นโมเดิร์น (inline SVG) ===== */
.ic-svg{vertical-align:-0.18em;flex:none}
.nav-item .ni-ic{display:inline-flex;align-items:center;justify-content:center}
.nav-item .ni-ic .ic-svg{display:block;vertical-align:middle}
.tile .tile-ic .ic-svg{display:block;vertical-align:middle}
.empty .ic .ic-svg{display:block;margin:0 auto;vertical-align:middle}
.btn .ic-svg{margin-right:7px}
.duty-band .duty-title .ic-svg{vertical-align:-0.16em;margin-right:4px}
.duty-band .duty-spot .duty-m .ic-svg{margin-right:3px;vertical-align:-0.12em}
</style>

</head>
<body>
<div class="app">

  <!-- ===== LOGIN ===== -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="brand-logo"></div>
      <h2 class="login-title">MRI KCMH</h2>
      <p class="login-sub">ระบบบุคลากรออนไลน์ · หน่วยรังสีวินิจฉัย</p>
      <div class="field">
        <label>User</label>
        <input id="inpEmpId" type="text" inputmode="text" placeholder="รหัสผู้ใช้" autocomplete="off">
      </div>
      <div class="field">
        <label>PIN</label>
        <input id="inpPin" type="password" inputmode="numeric" placeholder="รหัส PIN" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div id="mainApp" class="hidden">
    <div class="topbar">
      <div class="topbar-row">
        <div class="tb-logo"></div>
        <div class="tb-info">
          <div class="greet" id="tbGreet">สวัสดี</div>
          <div class="tb-name" id="tbName">—</div>
          <div class="tb-sub" id="tbSub">หน่วยรังสีวินิจฉัย MRI · KCMH</div>
        </div>
        <div class="tb-actions">
          <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="สลับโหมดกลางวัน/กลางคืน" title="สลับโหมดกลางวัน/กลางคืน">🌙</button>
          <div class="avatar" id="tbAvatar">–</div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="bottomnav" id="bottomnav"></div>
  </div>

  <!-- ===== SPLASH ===== -->
  <div id="splash" class="login-wrap" style="position:fixed;inset:0;z-index:100">
    <div style="text-align:center;color:#fff">
      <div class="brand-logo" style="margin-bottom:14px"></div>
      <div class="spinner" style="width:26px;height:26px;border-width:3px"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>


<script>
/* ============================================================
   MRI KCMH — Client (เชื่อม backend ผ่าน google.script.run)
   ============================================================ */
const FALLBACK_TYPES=[
  {name:'ลาป่วย',color:'#ef4444'},{name:'ลากิจส่วนตัว',color:'#8b5cf6'},{name:'ลาพักร้อน',color:'#0d9488'},
  {name:'ลาประชุม/อบรม',color:'#3b82f6'},{name:'Off Incharge',color:'#f59e0b'},{name:'ลาคลอด',color:'#ec4899'},
  {name:'ลาบวช',color:'#a16207'},{name:'ลาอื่นๆ',color:'#64748b'}];
const state={token:null,user:null,leaveTypes:FALLBACK_TYPES,myRequests:[],pending:[],tab:'home',
  form:{leaveType:'',dayPart:'เต็มวัน'},calYm:null,calCache:{},staff:[],
  assign:{list:[],current:null,names:[],published:null}};
const $=s=>document.querySelector(s);
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONTHS_SHORT=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];

/* ---- ไอคอนเส้นโมเดิร์น (Lucide-style inline SVG) ---- */
const ICONS={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h3v-5h6v5h3a1 1 0 0 0 1-1V9.5"/>',
 edit:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M12 15h4.5"/><path d="M18.5 3.5a2.1 2.1 0 0 1 3 3L14 14l-4 1 1-4z"/>',
 calendar:'<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/>',
 grid:'<rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
 user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-3.9 3.4-6 7.5-6s7.5 2.1 7.5 6"/>',

/* ====== ตั้งค่า: วาง URL ของ Google Apps Script Web App (ลงท้าย /exec) ====== */
const API_URL='https://script.google.com/macros/s/AKfycbxmysWF7OZ4tuQr-mPRcxKkV6R5aQxpCv-eMz8QLtfpbPNFIMtp3immCfRanwWFV5hZ/exec';
const APP_VER='v'+'3';

let _cbSeq=0;
function _jsonp(action,payload,ms){
  return new Promise((resolve,reject)=>{
    if(!API_URL||API_URL.indexOf('PASTE_YOUR')>=0){ reject(new Error('ยังไม่ได้ตั้งค่า API_URL')); return; }
    const cb='__cb'+(++_cbSeq)+'_'+Date.now();
    const s=document.createElement('script');
    const timer=setTimeout(()=>{ done(); reject(new Error('timeout')); },ms||20000);
    function done(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(timer); }
    window[cb]=(data)=>{ done(); resolve(data); };
    s.onerror=()=>{ done(); reject(new Error('network')); };
    s.src=API_URL+'?action='+encodeURIComponent(action)+'&callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(payload||{}));
    document.head.appendChild(s);
  });
}
function _argsToPayload(action,a){
  switch(action){
    case 'login': return {user:a[0],pin:a[1]};
    case 'getBootstrap': return {token:a[0]};
    case 'submitLeave': return {token:a[0],payload:a[1]};
    case 'cancelLeave': return {token:a[0],requestId:a[1]};
    case 'decide': return {token:a[0],requestId:a[1],decision:a[2],comment:a[3]};
    case 'getMonthLeaves': return {token:a[0],ym:a[1]};
    case 'listStaff': return {token:a[0]};
    case 'addStaff': return {token:a[0],payload:a[1]};
    case 'updateStaff': return {token:a[0],targetUser:a[1],payload:a[2]};
    case 'listAssignments': return {token:a[0]};
    case 'getAssignment': return {token:a[0],id:a[1]};
    case 'saveAssignment': return {token:a[0],payload:a[1]};
    case 'publishAssignment': return {token:a[0],id:a[1]};
    case 'unpublishAssignment': return {token:a[0],id:a[1]};
    case 'deleteAssignment': return {token:a[0],id:a[1]};
    case 'getPublishedAssignment': return {token:a[0]};
    case 'getMyProfile': return {token:a[0]};
    case 'updateMyProfile': return {token:a[0],payload:a[1]};
    case 'updateMyPhoto': return {token:a[0],photo:a[1]};
    default: return {};
  }
}
/* คำขอขนาดใหญ่ (รูปโปรไฟล์ / ตาราง Assignment ยาว ๆ) — URL ยาวเกินที่ Google รับ → ส่ง POST แล้วดึงผลด้วย JSONP */
/* ====== ส่งคำขอแบบ "ยิงสำรอง" (hedged request) ======
   วัดจากเซิร์ฟเวอร์จริง: Google ตอบปกติ 1–3 วินาที แต่ราว 1 ใน 6 ครั้งค้าง 9–16 วินาที และบางครั้งล้มเหลวเลย
   (เป็นที่ฝั่ง Google เอง แม้คำขอเปล่า ๆ ที่ไม่ทำอะไรก็เป็น) → ถ้าคำขอแรกยังไม่ตอบในไม่กี่วินาที ให้ยิงคำขอสำรองคู่ขนาน
   แล้วใช้คำตอบที่มาถึงก่อน · ถ้าคำขอไหนล้มเหลวก็ยิงตัวใหม่ทันที โดยไม่ทิ้งคำขอที่ยังรออยู่ */
const _HEDGE_READ=[0,3000,7000,12000], _HEDGE_WRITE=[0,7000,15000], _MAX_TRY=6, _OVERALL_MS=45000;
function _hedged(action,payload,delays){
  return new Promise((resolve,reject)=>{
    let finished=false, launched=0, failed=0, lastErr=null; const timers=[];
    const finish=(fn,v)=>{ if(finished) return; finished=true; timers.forEach(clearTimeout); fn(v); };
    const launch=()=>{
      if(finished||launched>=_MAX_TRY) return;
      launched++;
      _jsonp(action,payload,_OVERALL_MS).then(r=>finish(resolve,r),e=>{
        if(finished) return;
        lastErr=e; failed++;
        if(String(e&&e.message).indexOf('API_URL')>=0){ finish(reject,e); return; }
        if(launched<_MAX_TRY) timers.push(setTimeout(launch,400*failed));   // ล้มเหลว → ยิงตัวใหม่แทนเกือบทันที
        else if(failed>=launched) finish(reject,lastErr);                    // ลองครบแล้วล้มเหลวทุกตัว
      });
    };
    delays.forEach(d=>timers.push(setTimeout(launch,d)));
    timers.push(setTimeout(()=>finish(reject,lastErr||new Error('timeout')),_OVERALL_MS+1000));
  });
}
function _postLarge(action,payload){
  const nonce='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const body=JSON.stringify({action:action,payload:payload,nonce:nonce});
  const send=()=>fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}).catch(()=>null);
  const poll=(i)=>_hedged('result',{nonce:nonce},_HEDGE_READ).then(r=>{
    if(r&&r.pending){
      if(i>=30) throw new Error('timeout');
      const again=(i===12)?send():Promise.resolve();              // ยังไม่มีผล → ส่งซ้ำ 1 ครั้ง (server กันซ้ำด้วย _rid)
      return again.then(()=>new Promise(ok=>setTimeout(ok,1000))).then(()=>poll(i+1)); }
    return r; });
  return send().then(()=>poll(0));
}
/* คำสั่งอ่านข้อมูล ยิงสำรองได้เร็ว · คำสั่งบันทึกแนบรหัสคำขอ (_rid) ให้เซิร์ฟเวอร์ทำจริงแค่ครั้งเดียวแม้ส่งซ้ำ */
const _READ={login:1,getBootstrap:1,getMonthLeaves:1,listStaff:1,listAssignments:1,getAssignment:1,getPublishedAssignment:1,getMyProfile:1,ping:1};
function callServer(action,...args){
  const p=_argsToPayload(action,args);
  if(!_READ[action]||action==='login') p._rid='w'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  if(encodeURIComponent(JSON.stringify(p)).length>6000) return _postLarge(action,p);
  return _hedged(action,p,_READ[action]?_HEDGE_READ:_HEDGE_WRITE);
}
/* ปลุกเซิร์ฟเวอร์ Google ล่วงหน้าตอนเปิดหน้าล็อกอิน (ระหว่างที่ผู้ใช้พิมพ์ User/PIN) */

  state.token=t;

  if(cached){ applyBootstrap(cached,true); enterApp(); }        // เปิดได้ทันทีจากข้อมูลล่าสุดในเครื่อง

    else if(!cached){ showLogin(); }
  }).catch(()=>{ if(!cached) showLogin(); else toast('เชื่อมต่อไม่สำเร็จ — แสดงข้อมูลล่าสุด','err'); });
});

/* ---- Login ---- */
let _loggingIn=false;
function doLogin(){
  if(_loggingIn) return;                                   // กันกดซ้ำ/กด Enter ซ้ำระหว่างรอ
  const id=$('#inpEmpId').value.trim(), pin=$('#inpPin').value.trim();
  const err=$('#loginErr'); err.textContent=''; err.style.color='';
  if(!id||!pin){ err.textContent='กรุณากรอก User และ PIN'; return; }
  const btn=$('#btnLogin'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  _loggingIn=true;
  const slow=_busyNote(err);
  const reset=(msg)=>{ _loggingIn=false; clearTimeout(slow); btn.disabled=false; btn.textContent='เข้าสู่ระบบ';
    err.style.color=''; err.textContent=msg||''; };
  // ปุ่มหมุนต่อจนกว่าจะเข้าแอปได้จริง (เดิมปุ่มกลับมาก่อนโหลดข้อมูลเสร็จ ทำให้ดูเหมือนกดไม่ติด)
  const enter=(b)=>{ reset(); applyBootstrap(b); enterApp(); };
  callServer('login',id,pin).then(res=>{
    if(!res||!res.ok){ reset((res&&res.message)||'เข้าสู่ระบบไม่สำเร็จ'); return; }
    state.token=res.token; saveToken(res.token); state.user=res.user; $('#inpPin').value='';
    if(res.boot&&res.boot.ok){ enter(res.boot); return; }           // เซิร์ฟเวอร์ใหม่ส่งข้อมูลมาพร้อมกันเลย
    return callServer('getBootstrap',res.token).then(b=>{
      if(b&&b.ok) enter(b); else reset((b&&b.message)||'โหลดข้อมูลไม่สำเร็จ ลองใหม่'); });
  }).catch(()=>{ reset('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง'); });
}

function applyBootstrap(res,fromCache){
  state.user=res.user; if(state.user){ state.user.photo=res.photo||''; state.user.sex=res.sex||''; state.user.incharge=!!res.incharge; }
  state.leaveTypes=(res.leaveTypes&&res.leaveTypes.length)?res.leaveTypes:FALLBACK_TYPES;
  state.myRequests=res.myRequests||[]; state.pending=res.pending||[]; state.calCache={};
  // ข้อมูลที่เซิร์ฟเวอร์แนบมาล่วงหน้า → เปิดแท็บปฏิทิน / Assignment / โปรไฟล์ ได้ทันทีไม่ต้องรอ

  if('published' in res){ const a=res.published; state.assign.published=a?Object.assign({},a,{grid:normGrid(a.grid)}):null; state.assign.pubLoaded=true; }
  if(res.profile) state.pf=res.profile;
  if(Array.isArray(res.assignments)){ state.assign.list=res.assignments; state.assign.listLoaded=true; }
  if(!fromCache) saveBoot(res);
}

/* ---- Calendar (ปฏิทินการลารวม) ---- */
function renderCalendar(){
  if(!state.calYm) state.calYm=ymOf(new Date());
  $('#content').innerHTML='<div class="screen" id="calScreen"><div class="card"><div class="empty"><div class="spinner" style="border-color:var(--line);border-top-color:var(--brand)"></div></div></div></div>';
  const ym=state.calYm;
  const done=(leaves)=>{ state.calCache[ym]=leaves; if(state.tab==='calendar'&&state.calYm===ym) drawCalendar(ym,leaves); calPrefetch(ym); };
  if(state.calCache[ym]) { drawCalendar(ym,state.calCache[ym]); calPrefetch(ym); return; }
  calFetch(ym).then(res=>{
    if(!res.ok){ if(res.code==='AUTH'){logout();return;} done([]); return; }
    done(res.leaves||[]);
  }).catch(()=>done([]));
}
const _calInflight={};
function calFetch(ym){
  if(!_calInflight[ym]) _calInflight[ym]=callServer('getMonthLeaves',state.token,ym).finally(()=>{ delete _calInflight[ym]; });
  return _calInflight[ym];
}
/* โหลดเดือนก่อน/ถัดไปรอไว้ล่วงหน้า → กด ‹ › แล้วขึ้นทันที */
function calPrefetch(ym){
  const [y,m]=ym.split('-').map(Number);
  [-1,1].forEach(dx=>{ const k=ymOf(new Date(y,m-1+dx,1)); if(state.calCache[k]||_calInflight[k]) return;
    calFetch(k).then(r=>{ if(r&&r.ok) state.calCache[k]=r.leaves||[]; }).catch(()=>{}); });
}
function calShift(delta){
  const [y,m]=state.calYm.split('-').map(Number);
  const d=new Date(y,m-1+delta,1); state.calYm=ymOf(d); renderCalendar();
}
function buildDayMap(leaves,ym){
  const map={};
  leaves.forEach(l=>{
    let d=new Date(l.StartDate+'T00:00:00'), end=new Date(l.EndDate+'T00:00:00');
    let guard=0;
    while(d<=end&&guard<400){ const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(ds.slice(0,7)===ym){ (map[ds]=map[ds]||[]).push(l); }
      d.setDate(d.getDate()+1); guard++; }
  });
  return map;
}
function drawCalendar(ym,leaves){
  const [y,m]=ym.split('-').map(Number);
  const map=buildDayMap(leaves,ym);
  const firstDow=new Date(y,m-1,1).getDay();
  const daysIn=new Date(y,m,0).getDate();
  const today=todayStr();
  let cells='';
  for(let i=0;i<firstDow;i++) cells+='<div class="cal-cell other"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=ym+'-'+String(d).padStart(2,'0');
    const items=map[ds]||[];
    const dots=items.slice(0,3).map(l=>`<span class="cal-dot" style="background:${ltColor(l.LeaveType)};${l.Status==='รออนุมัติ'?'opacity:.4':''}"></span>`).join('');
    const more=items.length>3?`<span class="cal-more">+${items.length-3}</span>`:'';
    cells+=`<div class="cal-cell ${items.length?'has':''} ${ds===today?'today':''}" ${items.length?`onclick="openDay('${ds}')"`:''}>
      <span class="cal-num">${d}</span><span class="cal-dots">${dots}${more}</span></div>`;
  }
  const legend=state.leaveTypes.map(t=>`<span><span class="lg-dot" style="background:${t.color}"></span>${esc(t.name)}</span>`).join('');
  $('#content').innerHTML=`<div class="screen"><div class="card">
    <div class="cal-head">
      <button onclick="calShift(-1)">‹</button>
      <div class="cal-title">${MONTHS[m-1]} ${y+543}</div>
      <button onclick="calShift(1)">›</button></div>
    <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="cal-legend">${legend}</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">จุดโปร่ง = รออนุมัติ · แตะวันที่มีจุดเพื่อดูรายชื่อ</div>
  </div></div>`;
}
function openDay(ds){
  const leaves=(state.calCache[state.calYm]||[]).filter(l=>l.StartDate<=ds&&l.EndDate>=ds);
  const rows=leaves.map(l=>`<div class="day-person">
      <span class="dp-dot" style="background:${ltColor(l.LeaveType)}"></span>
      <div style="flex:1"><div class="dp-name">${esc(l.Name)}</div>
      <div class="dp-type">${esc(l.LeaveType)}${l.DayPart&&l.DayPart!=='เต็มวัน'?' ('+esc(l.DayPart)+')':''}</div></div>
      <span class="badge ${statusClass(l.Status)}">${esc(l.Status)}</span></div>`).join('');

      <button class="btn btn-ghost" style="margin-top:14px" onclick="closeSheet()">ปิด</button></div></div>`;
}

    if(res.staff){ state.staff=res.staff; state.assign.names=res.staff.map(s=>s.Name); drawStaff(); } else renderStaff(); };
  const fail=()=>{ btn.disabled=false; err.textContent='เชื่อมต่อไม่สำเร็จ'; };
  if(targetUser){ callServer('updateStaff',state.token,targetUser,{name:name,pin:pin,position:pos}).then(done).catch(fail); }
  else{
    if(!name||!user||!pin){ btn.disabled=false; err.textContent='กรุณากรอก ชื่อ / User / PIN'; return; }
    callServer('addStaff',state.token,{name:name,user:user,pin:pin,position:pos}).then(done).catch(fail);
  }
}

/* ============================================================
   Assignment (ตารางมอบหมายงาน)
   ADMIN: สร้าง/แก้/ร่าง/เผยแพร่ · STAFF: ดูอันที่เผยแพร่
   ============================================================ */
const _spin='<div class="empty"><div class="spinner" style="border-color:var(--line);border-top-color:var(--brand)"></div></div>';
function cardBusy(){ $('#content').innerHTML='<div class="screen"><div class="card">'+_spin+'</div></div>'; }
function cardMsg(m){ return '<div class="screen"><div class="card"><div class="empty"><p>'+esc(m)+'</p></div></div></div>'; }

function renderAssign(){ if(isAdmin()) renderAssignList(); else renderAssignView(); }

/* ---- cell helpers: แต่ละช่อง = {v:ชื่อ/ข้อความ, n:หมายเหตุ} ---- */
function cellV(x){ return (x&&typeof x==='object')?String(x.v||''):String(x==null?'':x); }
function cellN(x){ return (x&&typeof x==='object')?String(x.n||''):''; }
function mkCell(v,n){ return {v:String(v||''),n:String(n||'')}; }
function normGrid(g){ return (g||[]).map(function(row){ return (row||[]).map(function(c){ return mkCell(cellV(c),cellN(c)); }); }); }

/* ---- แถบ "สถานที่ปฏิบัติงานเดือนนี้ของคุณ" (ใช้ทั้ง STAFF/ADMIN) ---- */
function myDutyBandHTML(grid){
  const me=(state.user&&state.user.Name)||'', myF=firstName(me), spots=[];
  (grid||[]).forEach(function(row,r){ if(r===0)return; row.forEach(function(c,ci){ if(ci<2)return;
    const v=cellV(c).trim(); if(!v)return;
    if(v===me || (myF && firstName(v)===myF)){ spots.push({b:cellV(row[0]),m:cellV(row[1]),note:cellN(c)}); } }); });
  if(!spots.length) return '<div class="duty-band duty-none"><div class="duty-title">'+ic('pin',{size:18})+' สถานที่ปฏิบัติงานเดือนนี้ของคุณ</div>'
    +'<div style="font-size:13px">ยังไม่มีสถานที่ปฏิบัติงานของคุณในตารางนี้</div></div>';
  return '<div class="duty-band"><div class="duty-title">'+ic('pin',{size:18})+' สถานที่ปฏิบัติงานเดือนนี้ของคุณ</div><div class="duty-spots">'
    +spots.map(function(s){ return '<div class="duty-spot"><div class="duty-b">'+(esc(s.b)||'-')+'</div>'
      +'<div class="duty-m">'+ic('scan',{size:14})+' '+(esc(s.m)||'-')+(s.note?(' · '+esc(s.note)):'')+'</div></div>'; }).join('')
    +'</div></div>';
}

/* ---- STAFF / published (read-only) ---- */
function renderAssignView(){
  const had=state.assign.pubLoaded;
  if(had) drawAssignView(state.assign.published); else cardBusy();   // มีข้อมูลแล้ว → แสดงทันที
  callServer('getPublishedAssignment',state.token).then(res=>{
    if(state.tab!=='assign') return;

    const a=res.assignment, old=state.assign.published;
    state.assign.pubLoaded=true;
    if(had && ((!a&&!old) || (a&&old&&a.id===old.id&&a.updatedAt===old.updatedAt))) return;   // ไม่มีอะไรเปลี่ยน
    drawAssignView(a?Object.assign({},a,{grid:normGrid(a.grid)}):null);
  }).catch(()=>{ if(!had) $('#content').innerHTML=cardMsg('เชื่อมต่อไม่สำเร็จ'); });

function drawAssignView(a){
    if(!a){ state.assign.published=null; $('#content').innerHTML='<div class="screen"><div class="card"><div class="empty"><div class="ic">'+ic("calendar",{size:46,sw:1.5})+'</div><p>ยังไม่มีตารางที่เผยแพร่</p></div></div></div>'; return; }

function gridReadHTML(grid){
  grid=grid||[]; if(!grid.length) return '<div class="empty" style="padding:24px"><p>ตารางว่าง</p></div>';

function showNote(r,c){

function newAssignment(){
  // โครงตามแท็บ Assignment ในชีต: อาคาร | MRI | เจ้าหน้าที่ 1-7 (เฉพาะเครื่อง MRI)
  const header=['อาคาร','MRI','เจ้าหน้าที่ 1','เจ้าหน้าที่ 2','เจ้าหน้าที่ 3'];
  const base=[['ภูมิสิริ ชั้น 2','PHILIPS 3T'],['ภูมิสิริ ชั้น 2','GE 3T'],['ภูมิสิริ ชั้น 2','SIEMENS 1.5T'],
    ['ภูมิสิริ ชั้น 4','SIEMENS 3T'],['นวัตบริบาล 1','PHILIPS 3T'],['นวัตบริบาล 1','GE 1.5T'],['นวัตบริบาล 1','SIEMENS 3T']];
  const grid=[header.map(function(h){ return mkCell(h); })].concat(base.map(function(r){
    return [mkCell(r[0]),mkCell(r[1]),mkCell(''),mkCell(''),mkCell('')]; }));

function openAssignEditor(id){
  state.tab='assignEdit'; updateHeader(); renderNav(); cardBusy();
  const ensureNames=state.assign.names.length?Promise.resolve():callServer('listStaff',state.token).then(r=>{ if(r&&r.ok) state.assign.names=(r.staff||[]).map(s=>s.Name); }).catch(()=>{});
  const load=id?callServer('getAssignment',state.token,id).then(r=>(r&&r.ok)?r.assignment:null):Promise.resolve(newAssignment());
  Promise.all([ensureNames,load]).then(vals=>{ const a=vals[1];
    if(!a){ toast('ไม่พบตาราง','err'); go('assign'); return; }
    a.grid=normGrid(a.grid); state.assign.current=a; drawEditor();

function _parseAsgTitle(t){ t=String(t||''); let mi=-1;
  for(let i=0;i<MONTHS.length;i++){ if(t.indexOf(MONTHS[i])>=0){ mi=i; break; } }
  const ym=t.match(/(\d{4})/), now=new Date();
  return {m:(mi>=0?mi+1:now.getMonth()+1), y:(ym?parseInt(ym[1],10):now.getFullYear()+543)}; }
function _asgTitleFrom(m,y){ return MONTHS[m-1]+' '+y; }
function _syncTitle(){ const m=$('#asgMonth'), y=$('#asgYear');
  if(m&&y&&state.assign.current) state.assign.current.title=_asgTitleFrom(parseInt(m.value,10),parseInt(y.value,10)); }
function drawEditor(){
  const a=state.assign.current, g=a.grid;
  const body=g.map((row,r)=>'<tr>'+
    row.map(function(cell,c){ const raw=cellV(cell), disp=(r>0&&c>1)?firstName(raw):raw, note=cellN(cell)?' <span class="note-dot"></span>':'';
      return `<td class="asg-cell ${r===0?'hd':''} ${raw?'':'blank'}" onclick="openCell(${r},${c})">${esc(disp)||(r===0?'':'—')}${note}</td>`;
    }).join('')+'</tr>').join('');
  const table=`<div class="grid-scroll freeze"><table class="asg-table freeze-table">${body}</table></div>`;
  const isPub=a.status==='published';
  const ty=_parseAsgTitle(a.title), nowBE=new Date().getFullYear()+543;
  const monthOpts=MONTHS.map((nm,i)=>`<option value="${i+1}" ${ty.m===i+1?'selected':''}>${nm}</option>`).join('');
  const y0=Math.min(nowBE-1,ty.y), y1=Math.max(nowBE+3,ty.y); let yearOpts='';
  for(let y=y0;y<=y1;y++) yearOpts+=`<option value="${y}" ${ty.y===y?'selected':''}>${y}</option>`;
  const selSt='padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft)';
  $('#content').innerHTML=`<div class="screen">
    <div class="field"><label>เดือน / ปี ของตาราง</label>
      <div style="display:flex;gap:8px">
        <select id="asgMonth" onchange="_syncTitle()" style="flex:2;${selSt}">${monthOpts}</select>
        <select id="asgYear" onchange="_syncTitle()" style="flex:1;${selSt}">${yearOpts}</select></div></div>
    ${table}
    <div class="asg-toolbar"><button onclick="asgAddCol()">${ic('plus',{size:15})} เพิ่มเจ้าหน้าที่</button><button onclick="asgAddRow()">${ic('plus',{size:15})} เพิ่มเครื่อง</button></div>
    <div class="asg-actions">
      <button class="btn btn-ghost" onclick="go('assign')">‹ กลับ</button>
      <button class="btn btn-primary" onclick="asgSaveDraft()">บันทึกร่าง</button></div>
    <div class="asg-actions">
      ${isPub?'<button class="btn btn-ghost" onclick="asgUnpublish()">ยกเลิกเผยแพร่</button>':'<button class="btn btn-ok" onclick="asgPublish()">เผยแพร่ให้ STAFF</button>'}
      ${a.id?'<button class="btn btn-danger" onclick="asgDelete()">ลบตาราง</button>':''}</div>
    ${isPub?'<div class="readonly-note" style="margin-top:12px">🟢 ตารางนี้กำลังเผยแพร่ให้ STAFF เห็นอยู่</div>':''}
  </div>`;
}
function asgAddCol(){ _syncTitle(); const g=state.assign.current.grid; if(!g.length)g.push([]);
  let maxN=0; (g[0]||[]).forEach(h=>{ const m=/เจ้าหน้าที่\s*(\d+)/.exec(cellV(h)); if(m) maxN=Math.max(maxN,parseInt(m[1],10)); });
  g.forEach((r,i)=>r.push(i===0?mkCell('เจ้าหน้าที่ '+(maxN+1)):mkCell(''))); drawEditor(); }
function asgAddRow(){ _syncTitle(); const g=state.assign.current.grid; const cols=(g[0]||[]).length||1;
  const row=[]; for(let i=0;i<cols;i++) row.push(mkCell('')); g.push(row); drawEditor(); }
function cellTitle(g,r,c){
  const colHdr=cellV(g[0]&&g[0][c]).trim()||('คอลัมน์ '+(c+1));
  if(r===0) return 'หัวคอลัมน์: '+colHdr;
  const bldg=cellV(g[r]&&g[r][0]).trim(), mri=cellV(g[r]&&g[r][1]).trim();
  const rowLabel=[bldg,mri].filter(Boolean).join(' · ')||('แถว '+(r+1));
  if(c===0) return 'อาคาร'+(mri?(' — '+mri):'');
  if(c===1) return 'MRI'+(bldg?(' — '+bldg):'');
  return rowLabel+' — '+colHdr;
}
function openCell(r,c){
  const g=state.assign.current.grid, cur=g[r]&&g[r][c];
  const isStaff=(r>0&&c>1);
  let valField;
  if(isStaff){
    const cv=cellV(cur), names=(state.assign.names||[]).slice();
    if(cv && names.indexOf(cv)<0) names.unshift(cv);
    const opts='<option value="">— เลือกชื่อ —</option>'+names.map(n=>`<option ${n===cv?'selected':''}>${esc(n)}</option>`).join('');
    valField=`<div class="field"><label>ชื่อเจ้าหน้าที่ (เลือกจากรายชื่อ)</label>
      <select id="cellVal" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft)">${opts}</select>
      ${names.length?'':'<div class="asg-hint" style="margin-top:6px">ยังไม่มีรายชื่อเจ้าหน้าที่ในระบบ</div>'}</div>`;
  } else {
    valField=`<div class="field"><label>ข้อความ</label>
      <input id="cellVal" value="${esc(cellV(cur))}" placeholder="พิมพ์ข้อความ"></div>`;
  }
  $('#modalRoot').innerHTML=`<div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
    <div class="sheet"><div class="sheet-grip"></div>
      <div class="section-title" style="font-size:16px">${esc(cellTitle(g,r,c))}</div>
      ${valField}
      <div class="field" style="margin-top:12px"><label>หมายเหตุ (ถ้ามี)</label>
        <textarea id="cellNote" rows="2" placeholder="เช่น อยู่เวรถึง 12.00 น.">${esc(cellN(cur))}</textarea></div>
      <div class="detail-actions" style="margin-top:12px">
        <button class="btn btn-ghost" onclick="saveCell(${r},${c},true)">ล้างช่อง</button>
        <button class="btn btn-primary" onclick="saveCell(${r},${c})">บันทึกช่อง</button></div>
    </div></div>`;
}
function saveCell(r,c,clear){
  if(clear){ state.assign.current.grid[r][c]=mkCell('',''); closeSheet(); drawEditor(); return; }
  const v=($('#cellVal')||{}).value||'', n=($('#cellNote')||{}).value||'';
  state.assign.current.grid[r][c]=mkCell(String(v).trim(),String(n).trim()); closeSheet(); drawEditor();
}
function asgSaveDraft(){ _syncTitle(); const a=state.assign.current;
  return callServer('saveAssignment',state.token,{id:a.id,title:a.title,grid:a.grid}).then(res=>{
    if(!res.ok){ if(res.code==='AUTH'){logout();return null;} toast(res.message||'บันทึกไม่สำเร็จ','err'); return null; }
    a.id=res.id; state.assign.listLoaded=false; toast('บันทึกร่างแล้ว ✓','ok'); return res.id;
  }).catch(()=>{ toast('เชื่อมต่อไม่สำเร็จ','err'); return null; });
}
function asgPublish(){ asgSaveDraft().then(id=>{ if(!id)return;
  callServer('publishAssignment',state.token,id).then(res=>{ if(!res.ok){ toast(res.message||'เผยแพร่ไม่สำเร็จ','err'); return; }
    state.assign.listLoaded=false; state.assign.pubLoaded=false; toast('เผยแพร่แล้ว ✓','ok'); go('assign'); }); }); }
function asgUnpublish(){ const a=state.assign.current; if(!a.id)return;

function asgDelete(){ const a=state.assign.current; if(!a.id){ go('assign'); return; }

    <div class="section-title" style="font-size:16px">ลบตารางนี้?</div>
    <p style="color:var(--muted);font-size:14px;margin:4px 0 0">"${esc(a.title)||'ไม่มีชื่อ'}" จะถูกลบถาวร</p>
    <div class="detail-actions" style="margin-top:14px"><button class="btn btn-ghost" onclick="closeSheet()">ยกเลิก</button>
      <button class="btn btn-danger" onclick="asgDeleteConfirm()">ลบ</button></div></div></div>`;

function asgDeleteConfirm(){ const a=state.assign.current;
  callServer('deleteAssignment',state.token,a.id).then(res=>{ closeSheet(); if(!res.ok){ toast(res.message||'ลบไม่สำเร็จ','err'); return; }

/* ---- Profile (แก้ไขข้อมูลส่วนตัวของตนเองได้ · ฟิลด์ตามคอลัมน์ชีต DATA) ---- */
const PF_LABEL={Name:'ชื่อ-นามสกุล',User:'รหัสผู้ใช้ (User)',PIN:'PIN',Position:'ตำแหน่ง',Sex:'เพศ',Birthdate:'วันเกิด',Phone:'เบอร์โทร',INCHARGE:'INCHARGE'};
function pfLabel(k){ return PF_LABEL[k]||k; }
function fieldKind(key){ const k=String(key).toUpperCase();
  if(k==='PIN')return'pin'; if(k==='USER')return'user'; if(k==='POSITION')return'position';
  if(k==='INCHARGE')return'incharge'; if(k==='SEX')return'sex'; if(k==='BIRTHDATE')return'birthdate'; if(k==='PHONE')return'phone';
  return 'text'; }
function truthy(v){ const s=String(v==null?'':v).trim().toLowerCase(); return v===true||['true','ใช่','yes','y','1','✓','x','checked'].indexOf(s)>=0; }
function computeAge(iso){ const p=String(iso||'').split('-'); if(p.length!==3)return'';
  const bd=new Date(+p[0],+p[1]-1,+p[2]); if(isNaN(bd.getTime()))return''; const now=new Date();
  let a=now.getFullYear()-bd.getFullYear(); const mm=now.getMonth()-bd.getMonth();
  if(mm<0||(mm===0&&now.getDate()<bd.getDate()))a--; return (a>=0&&a<130)?a:''; }
function phoneFmt(v){ let d=String(v||'').replace(/\D/g,'').slice(0,10);
  if(d.length>6)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  if(d.length>3)return d.slice(0,3)+'-'+d.slice(3); return d; }
function birthdateWidget(value){

function svgToDataUrl(svg,cb){

    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size); ctx.drawImage(img,0,0,size,size);
    let q=0.85, url=c.toDataURL('image/jpeg',q);
    while(url.length>40000 && q>0.4){ q-=0.1; url=c.toDataURL('image/jpeg',q); }
    cb(url);

  img.onerror=function(){ cb(null); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

}
function avatPickPreset(i){ const p=AVATAR_PRESETS[i]; state.avat.presetIdx=i; const a=state.avat;
  if(p.animal){ a.mode='animal'; a.animal=p.animal; a.fur=p.fur||_animalDefFur(p.animal); a.bg=p.bg||a.bg;
    a.acc=(['none','glasses','bow'].indexOf(p.acc)>=0)?p.acc:'none'; }
  else { a.mode='person'; a.skin=p.skin||a.skin; a.hairStyle=p.hairStyle||'short'; a.hairColor=p.hairColor||AV_HAIR[0];
    a.eye=p.eye||AV_EYE[0]; a.bg=p.bg||a.bg; a.shirt=p.shirt||'#ffffff'; a.acc=p.acc||'none';
    a.cap=!!p.cap; a.capColor=p.capColor||a.capColor; }
  state.avat.pending={kind:'svg',svg:avatarSVG(p)};
  document.querySelectorAll('.avat-grid .avat-cell').forEach((b,j)=>b.classList.toggle('sel',j===i));
  avatRenderPreview();
}

    <div class="avat-row"><div class="avat-row-lbl">สีผม</div><div class="avat-sws">${sw(AV_HAIR,a.hairColor,'avatSetHair')}</div></div>
    <div class="avat-row"><div class="avat-row-lbl">สีตา</div><div class="avat-sws">${sw(AV_EYE,a.eye,'avatSetEye')}</div></div>
    <div class="avat-row"><div class="avat-row-lbl">สีผิว</div><div class="avat-sws">${sw(AV_SKIN,a.skin,'avatSetSkin')}</div></div>
    <div class="avat-row"><div class="avat-row-lbl">สีเสื้อ</div><div class="avat-sws">${sw(AV_SHIRT,a.shirt,'avatSetShirt')}</div></div>
    <div class="avat-row"><div class="avat-row-lbl">สีพื้นหลัง</div><div class="avat-sws">${sw(AV_BG,a.bg,'avatSetBg')}</div></div>
    <div class="avat-row" style="align-items:flex-start"><div class="avat-row-lbl" style="padding-top:8px">ของประดับ</div><div class="chips" style="margin-top:0">${chips(AV_ACC,a.acc,'avatSetAcc')}</div></div>`;
}
function _avatAfter(){ state.avat.presetIdx=-1; state.avat.cap=false;
  state.avat.pending={kind:'svg',svg:avatarSVG(_avatCustomOpts())};
  if(state.avat.tab==='custom'){ const b=$('#avatBody'); if(b) b.innerHTML=avatCustomHTML(); } avatRenderPreview(); }
function avatMode(m){ const a=state.avat; a.mode=m;
  if(m==='animal'){ if(!a.animal)a.animal='cat'; if(!a.fur)a.fur=_animalDefFur(a.animal); if(['none','glasses','bow'].indexOf(a.acc)<0)a.acc='none'; }
  else { const ok=['none','glasses','mask','mirror']; if(ok.indexOf(a.acc)<0)a.acc='none'; }
  _avatAfter(); }
function avatSetAnimal(v){ state.avat.animal=v; state.avat.fur=_animalDefFur(v); _avatAfter(); }
function avatSetFur(c){ state.avat.fur=c; _avatAfter(); }
function avatSetStyle(v){ state.avat.hairStyle=v; _avatAfter(); }
function avatSetHair(c){ state.avat.hairColor=c; _avatAfter(); }
function avatSetEye(c){ state.avat.eye=c; _avatAfter(); }
function avatSetSkin(c){ state.avat.skin=c; _avatAfter(); }
function avatSetShirt(c){ state.avat.shirt=c; _avatAfter(); }
function avatSetBg(c){ state.avat.bg=c; _avatAfter(); }
function avatSetAcc(v){ state.avat.acc=v; _avatAfter(); }
function _avatPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function avatRandom(){ const a=state.avat;
  if(a.mode==='animal'){ a.animal=_avatPick(AV_ANIMALS)[0]; a.fur=_avatPick(AV_FUR); a.bg=_avatPick(AV_BG); a.acc=_avatPick(AV_ANIMAL_ACC)[0]; }
  else { a.skin=_avatPick(AV_SKIN); a.hairStyle=_avatPick(HAIRSTYLES)[0]; a.hairColor=_avatPick(AV_HAIR); a.eye=_avatPick(AV_EYE);
    a.shirt=_avatPick(AV_SHIRT); a.bg=_avatPick(AV_BG); a.acc=_avatPick(AV_ACC)[0]; }
  _avatAfter(); }
function avatUploadHTML(){
  return `<div style="text-align:center;padding:8px 0">
    <button class="btn btn-ghost" style="width:auto;padding:12px 22px" onclick="document.getElementById('avatFile').click()">📁 เลือกรูปจากเครื่อง</button>
    <div class="asg-hint" style="text-align:center;margin-top:10px">รองรับไฟล์ภาพ · ระบบจะย่อขนาดให้อัตโนมัติ แล้วกด “บันทึกรูปนี้”</div></div>`;
}
function avatUpload(input){
  const file=input.files&&input.files[0]; if(!file) return;
  if(!/^image\//.test(file.type)){ toast('กรุณาเลือกไฟล์รูปภาพ','err'); return; }
  toast('กำลังประมวลผลรูป...','');
  compressImage(file,function(url){ if(!url){ toast('อ่านรูปไม่สำเร็จ','err'); return; }
    state.avat.presetIdx=-1; state.avat.pending={kind:'url',url:url}; avatRenderPreview(); toast('พร้อมบันทึก ✓','ok'); });
}
function saveAvatarPending(){
  const p=state.avat&&state.avat.pending; if(!p){ toast('เลือกรูปก่อน','err'); return; }
  const btn=$('#avatSaveBtn'); const reset=()=>{ if(btn){ btn.disabled=false; btn.textContent='บันทึกรูปนี้'; } };
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span>'; }
  const finish=(url)=>{
    if(!url){ reset(); toast('สร้างรูปไม่สำเร็จ','err'); return; }
    if(url.length>60000){ reset(); toast('รูปใหญ่เกินไป ลองใหม่','err'); return; }
    callServer('updateMyPhoto',state.token,url).then(function(res){
      if(!res||!res.ok){ reset(); if(res&&res.code==='AUTH'){logout();return;} toast((res&&res.message)||'บันทึกรูปไม่สำเร็จ','err'); return; }
      if(state.user) state.user.photo=url; setTopAvatar();
      const bc=readBoot(); if(bc){ bc.photo=res.photo||url; saveBoot(bc); }
      const pa=$('#pfAvatar'); if(pa) pa.innerHTML=avatarInner(url,state.user.Name);
      closeSheet(); toast('เปลี่ยนรูปแล้ว ✓','ok');
    }).catch(function(){ reset(); toast('เชื่อมต่อไม่สำเร็จ','err'); });
  };
  if(p.kind==='svg') svgToDataUrl(p.svg,finish); else finish(p.url);
}
function compressImage(file,cb){
  const img=new Image();
  img.onload=function(){
    const size=128, c=document.createElement('canvas'); c.width=size; c.height=size; const ctx=c.getContext('2d');
    const s=Math.min(img.width,img.height), sx=(img.width-s)/2, sy=(img.height-s)/2;
    ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
    let q=0.6, url=c.toDataURL('image/jpeg',q);
    while(url.length>14000 && q>0.3){ q-=0.1; url=c.toDataURL('image/jpeg',q); }
    cb(url);
  };
  img.onerror=function(){ cb(null); };
  const fr=new FileReader(); fr.onload=function(e){ img.src=e.target.result; }; fr.onerror=function(){ cb(null); }; fr.readAsDataURL(file);
}
function openProfileEdit(){
  const fields=(state.pf)||[];
  if(!fields.length){ toast('กำลังโหลดข้อมูล ลองอีกครั้ง','err'); return; }
  const selSt='width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft)';
  const inputs=fields.map(function(f,idx){
    const kind=fieldKind(f.key);
    if(!f.editable){
      const disp = kind==='incharge' ? (truthy(f.value)?'✓ ใช่':'– ไม่') : esc(f.value);
      return `<div class="field"><label>${esc(pfLabel(f.key))}</label>
        <input value="${disp}" disabled style="background:var(--gray-bg);color:var(--muted)"></div>`;
    }
    if(f.secret) return `<div class="field"><label>${esc(pfLabel(f.key))} (เว้นว่างถ้าไม่เปลี่ยน)</label>
      <input id="pf_${idx}" type="password" inputmode="numeric" placeholder="••••" autocomplete="off"></div>`;
    if(kind==='sex'){ const v=String(f.value||'');
      return `<div class="field"><label>${esc(pfLabel(f.key))}</label>
        <select id="pf_${idx}" style="${selSt}"><option value="">— เลือก —</option>
          <option ${v==='ชาย'?'selected':''}>ชาย</option><option ${v==='หญิง'?'selected':''}>หญิง</option></select></div>`; }
    if(kind==='birthdate') return birthdateWidget(f.value);
    if(kind==='phone') return `<div class="field"><label>${esc(pfLabel(f.key))} (XXX-XXX-XXXX)</label>
      <input id="pf_${idx}" inputmode="numeric" value="${esc(phoneFmt(f.value))}" oninput="this.value=phoneFmt(this.value)" placeholder="0xx-xxx-xxxx"></div>`;
    return `<div class="field"><label>${esc(pfLabel(f.key))}</label>
      <input id="pf_${idx}" value="${esc(f.value)}"></div>`;
  }).join('');
  $('#modalRoot').innerHTML=`<div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
    <div class="sheet"><div class="sheet-grip"></div>
      <div class="section-title" style="font-size:17px">แก้ไขข้อมูลส่วนตัว</div>
      <div class="asg-hint">แก้ไข User และ PIN ของตนเองได้ · ตำแหน่ง และ INCHARGE แก้ไม่ได้ (หัวหน้าดูแล)</div>
      ${inputs}
      <div class="err" id="pfErr" style="text-align:left"></div>
      <div class="detail-actions" style="margin-top:8px">
        <button class="btn btn-ghost" onclick="closeSheet()">ยกเลิก</button>
        <button class="btn btn-primary" id="pfSave" onclick="saveProfile()">บันทึก</button></div>
    </div></div>`;
}
function saveProfile(){
  const fields=(state.pf)||[]; const payload={}; const err=$('#pfErr'); if(err)err.textContent='';
  fields.forEach(function(f,idx){ if(!f.editable) return; const kind=fieldKind(f.key);
    if(kind==='birthdate'){ const d=$('#pf_bd_d'),m=$('#pf_bd_m'),y=$('#pf_bd_y');
      if(d&&m&&y) payload[f.key]=(d.value&&m.value&&y.value)?(y.value+'-'+String(+m.value).padStart(2,'0')+'-'+String(+d.value).padStart(2,'0')):'';
      return; }
    const el=$('#pf_'+idx); if(!el) return;
    if(f.secret){ if(el.value.trim()!=='') payload[f.key]=el.value.trim(); }
    else if(kind==='phone'){ payload[f.key]=phoneFmt(el.value); }
    else { payload[f.key]=el.value.trim(); } });
  const btn=$('#pfSave'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span>'; }
  callServer('updateMyProfile',state.token,payload).then(res=>{
    if(!res||!res.ok){ if(btn){btn.disabled=false;btn.textContent='บันทึก';} if(err)err.textContent=(res&&res.message)||'บันทึกไม่สำเร็จ'; return; }
    closeSheet(); toast('บันทึกข้อมูลแล้ว ✓','ok');
    const redraw=()=>{ setTopAvatar(); updateHeader(); renderProfile(); };
    if(res.boot&&res.boot.ok){ applyBootstrap(res.boot); redraw(); }
    else callServer('getBootstrap',state.token).then(bs=>{ if(bs&&bs.ok){ applyBootstrap(bs); } redraw(); }).catch(redraw);
  }).catch(()=>{ if(btn){btn.disabled=false;btn.textContent='บันทึก';} if(err)err.textContent='เชื่อมต่อไม่สำเร็จ'; });
}

let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); _deferredPrompt=e; showInstallPill(); });

function showInstallPill(){
  if(document.getElementById('installPill')) return;
  const b=document.createElement('button'); b.id='installPill'; b.textContent='⬇️ ติดตั้งแอป';
  b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:70;background:#0f1c2e;color:#fff;border:none;border-radius:999px;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer';
  b.onclick=async()=>{ if(!_deferredPrompt)return; _deferredPrompt.prompt(); await _deferredPrompt.userChoice; _deferredPrompt=null; b.remove(); };
  document.body.appendChild(b);
}</script>
